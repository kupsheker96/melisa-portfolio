<style>
/* About lab 3 (Nov 27): three directions for the first About, after studying romainavalle.dev.
   What carries over from the reference, translated into this site's own material:
   - one restrained visual layer that runs through every section (there: an ASCII field; here: the square dots);
   - text that resolves out of that same material (there: scramble through ".,:;i1tL0@▒▓█"; here: through dot glyphs);
   - line-by-line masked reveals, scroll-triggered but time-based (power2.out, ~.1s stagger);
   - a strict grid with lots of empty columns, text placed in specific columns, one large type size per section;
   - small rewards for curiosity (letters that fall when you touch them, a band that slides in from the side you entered).
   Palette, fonts, grid and dots stay this site's: #121316 / #f4f3ef / #dfdfdb / #8e6bff, Archivo, JetBrains Mono, Mondwest. */
@font-face{font-family:'Mondwest';src:url(../fonts/ppmondwest-regular.woff2) format('woff2');font-display:swap}
:root{color-scheme:dark;--bg:#121316;--ink:#f4f3ef;--dim:#45484f;--mut:#9a9ea6;--line:#2c2e33;--vio:#8e6bff;--grey:#dfdfdb;--pad:clamp(16px,4vw,56px);--rule:calc(var(--pad) + (100vw - 2 * var(--pad)) * .16);--col:calc((100vw - 2 * var(--pad)) * .84 / 6);--ease:cubic-bezier(.2,.7,.2,1);--ease2:cubic-bezier(.65,0,.25,1)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:300 13px/1.55 'JetBrains Mono',ui-monospace,monospace;overflow-x:clip;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.bar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px var(--pad);padding-top:calc(8px + env(safe-area-inset-top,0px));pointer-events:none}
.bar > *{pointer-events:auto}
.grp{display:flex}
.grp > *{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid rgba(244,243,239,.5);background:rgba(18,19,22,.9);color:var(--ink);text-decoration:none;font:400 11px/1 'JetBrains Mono',monospace;cursor:pointer;white-space:nowrap}
.grp > * + *{margin-left:-1px}
.grp [aria-pressed=true]{background:var(--ink);color:var(--bg)}
.grp b{font:400 14px/1 'Mondwest',serif}
.grp .lb{color:var(--mut);cursor:default}
.sp{flex:1}
.tag{color:var(--mut);font-size:10px;background:rgba(18,19,22,.9);padding:4px 8px;border:1px solid var(--line)}
@media (max-width:760px){.grp > *{padding:0 9px;height:32px}.grp .t{display:none}.tag{display:none}}
/* context: the end of the pressed hero, closing into the dark as dots (a static dither, nothing runs) */
.ctx{height:60svh;background:var(--grey);display:flex;align-items:flex-end;padding:var(--pad);font-size:11px;color:rgba(18,19,22,.55)}
.dith{display:block;width:100%;height:34svh}
.scene{position:relative}
.stage{position:sticky;top:0;height:100svh;overflow:hidden}
.stage > canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ui{position:absolute;inset:0}
.next{height:46svh;background:var(--vio);color:#121316;display:flex;align-items:flex-start;padding:var(--pad);font-size:11px}
/* notes */
.notes{background:var(--bg);border-top:1px solid var(--line);padding:clamp(56px,7vw,110px) var(--pad);display:grid;grid-template-columns:16% repeat(6,minmax(0,1fr))}
.notes > *{padding-left:clamp(14px,1.6vw,24px)}
.notes .k{grid-column:1;padding-left:0;color:var(--mut);font-size:11px}
.notes h3{grid-column:2 / -1;margin:0 0 10px;font:800 clamp(38px,5vw,86px)/.86 'Archivo',sans-serif;font-stretch:62%;text-transform:uppercase;letter-spacing:-.015em}
.notes .lead{grid-column:2 / span 4;margin:0 0 34px;font:380 clamp(18px,1.6vw,24px)/1.32 'Archivo',sans-serif;color:#e6e5e0;max-width:34em}
.notes dl{grid-column:2 / -1;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 clamp(16px,2vw,32px)}
.notes dl div{padding:12px 0 16px;border-top:1px solid var(--line)}
.notes dl div.wide{grid-column:1 / -1}
.notes dt{color:var(--mut);font-size:11px;margin-bottom:6px}
.notes dd{margin:0;font:380 15px/1.55 'Archivo',sans-serif;color:#c9ccd1}
.notes .ref{grid-column:2 / -1;margin-top:40px;padding-top:14px;border-top:1px solid var(--line)}
.notes .ref h4{margin:0 0 10px;font:400 11px/1.4 'JetBrains Mono',monospace;color:var(--mut)}
.notes .ref ul{margin:0;padding:0 0 0 1.1em;columns:2;column-gap:clamp(16px,2vw,32px);font:380 15px/1.5 'Archivo',sans-serif;color:#c9ccd1}
.notes .ref li{break-inside:avoid;margin-bottom:8px}
@media (max-width:760px){.notes{grid-template-columns:1fr}.notes > *,.notes h3,.notes .lead,.notes dl,.notes .ref{grid-column:1;padding-left:0}.notes dl{grid-template-columns:1fr}.notes .ref ul{columns:1}}
/* shared type */
.lab{font:300 11px/1.4 'JetBrains Mono',monospace;color:var(--mut)}
.mw{font-family:'Mondwest',serif;font-weight:400;letter-spacing:0}
/* line-mask reveal (the reference's split-line: each line rises out of its own mask, staggered) */
.wm{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-bottom:-.12em}
.wi{display:inline-block;transform:translate3d(0,108%,0);transition:transform .75s var(--ease);transition-delay:calc(var(--i,0) * 95ms + var(--d,0ms))}
.on .wi{transform:none}
.done .wm{overflow:visible}
.fc{display:inline-block;will-change:transform}
/* the ink tag: the site's square highlight, used like the reference's black labels */
.tg{background:var(--ink);color:var(--bg);padding:0 .14em;margin:0 -.04em}
.rise{opacity:0;transform:translate3d(0,14px,0);transition:opacity .6s var(--ease),transform .8s var(--ease)}
.rise.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.wi,.rise{transition:none!important;transform:none!important;opacity:1!important}}

/* ===== 1 · Pieces ===== */
.c1 .hd{position:absolute;left:var(--pad);top:calc(72px + 6vh)}
.c1 .main{position:absolute;left:var(--rule);top:calc(64px + 6vh);width:calc(var(--col) * 4.1);margin:0;font:380 clamp(28px,3.5vw,62px)/1.08 'Archivo',sans-serif;letter-spacing:-.028em}
.c1 .sub{position:absolute;left:calc(var(--rule) + var(--col) * 4.4);right:var(--pad);bottom:var(--pad);margin:0;font:380 clamp(16px,1.3vw,21px)/1.34 'Archivo',sans-serif;letter-spacing:-.01em;color:#c9ccd1}
.c1 .sub .lab{display:block;margin-bottom:10px}
.c1 .hint{position:absolute;left:var(--pad);bottom:var(--pad)}
@media (max-width:760px){.c1 .hd{top:calc(64px + 2vh)}.c1 .main{left:var(--pad);right:var(--pad);width:auto;top:calc(88px + 3vh);font-size:clamp(25px,7.2vw,34px)}.c1 .sub{left:var(--pad);font-size:15px}.c1 .hint{display:none}}

/* ===== 2 · Both, differently ===== */
.c2 .txt{position:absolute;left:var(--rule);bottom:var(--pad);width:calc(var(--col) * 3.6)}
.c2 .main{margin:0;font:380 clamp(20px,1.95vw,34px)/1.16 'Archivo',sans-serif;letter-spacing:-.02em}
.c2 .main .k{transition:background .45s,color .45s;padding:0 .08em;margin:0 -.08em}
.c2 .main .k.hl{background:var(--ink);color:var(--bg)}
.c2 .main .k.hl.v{background:var(--vio);color:#121316}
.c2 .sub{position:absolute;left:calc(var(--rule) + var(--col) * 4.2);right:var(--pad);bottom:var(--pad);margin:0;font:380 clamp(15px,1.15vw,19px)/1.36 'Archivo',sans-serif;color:#c9ccd1}
.c2 .hd{position:absolute;left:var(--pad);bottom:var(--pad)}
.c2 .st{position:absolute;right:var(--pad);top:calc(64px + 3vh);text-align:right}
@media (max-width:760px){.c2 .txt{left:var(--pad);right:var(--pad);width:auto;bottom:calc(var(--pad) + 84px)}.c2 .main{font-size:19px}.c2 .sub{left:var(--pad);font-size:14px}.c2 .hd{display:none}}

/* ===== 3 · Three questions ===== */
.c3 .intro{position:absolute;left:var(--pad);top:calc(70px + 7vh);font:380 clamp(18px,1.6vw,26px)/1.2 'Archivo',sans-serif;letter-spacing:-.01em}
.c3 .list{position:absolute;left:0;right:0;top:calc(70px + 7vh + 64px);margin:0;padding:0 var(--pad);list-style:none}
.c3 .rw{position:relative;display:grid;grid-template-columns:16% minmax(0,1fr) auto;align-items:start;padding:12px 0 14px;cursor:default;outline:none}
.c3 .rw::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background-image:linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 6px);background-size:6px 2px;transform:scaleX(0);transform-origin:0 50%;transition:transform 1s var(--ease2)}
.c3 .rw.on::before{transform:scaleX(1)}
.c3 .rw .n{font-size:clamp(22px,2.2vw,36px);line-height:1;color:var(--mut);padding-top:.12em}
.c3 .rw .cl{font:600 clamp(32px,4.6vw,84px)/.98 'Archivo',sans-serif;font-stretch:66%;letter-spacing:-.02em;visibility:hidden}
.c3 .rw.on .cl{visibility:visible}
.c3 .rw .ar{font-size:14px;color:var(--mut);padding-top:.6em;opacity:0;transition:opacity .4s}
.c3 .rw.on .ar{opacity:1}
.c3 .band{position:absolute;left:calc(var(--pad) * -1);right:calc(var(--pad) * -1);top:2px;bottom:0;overflow:hidden;pointer-events:none}
.c3 .bi{position:absolute;inset:0;background:var(--ink);color:var(--bg);transform:translate3d(0,calc(-100% - 10px),0);display:flex;align-items:center}
.c3 .bi::before,.c3 .bi::after{content:"";position:absolute;left:0;right:0;height:6px;background:conic-gradient(var(--ink) 25%,transparent 0 50%,var(--ink) 0 75%,transparent 0) 0 0/6px 6px}
.c3 .bi::before{top:-6px}.c3 .bi::after{bottom:-6px}
.c3 .band{overflow:visible;clip-path:inset(-6px 0 -6px 0)}
.c3 .mq{display:flex;white-space:nowrap;font:600 clamp(32px,4.6vw,84px)/1 'Archivo',sans-serif;font-stretch:66%;letter-spacing:-.02em;will-change:transform}
.c3 .mq > *{flex:none}
.c3 .mq span{padding-right:.8em}
.c3 .mq i{font-style:normal;color:var(--vio);padding-right:.8em}
.c3 .rw.act .mq{animation:mq 26s linear infinite}
@keyframes mq{to{transform:translate3d(-50%,0,0)}}
.c3 .sub{position:absolute;left:var(--rule);right:var(--pad);bottom:var(--pad);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,1.6vw,24px);margin:0}
.c3 .sub span{font:380 clamp(14px,1.05vw,17px)/1.32 'Archivo',sans-serif;color:#c9ccd1;border-top:1px solid var(--line);padding-top:8px}
.c3 .sub b{display:block;font:400 15px/1 'Mondwest',serif;color:var(--mut);margin-bottom:6px}
@media (max-width:760px){.c3 .rw{grid-template-columns:40px minmax(0,1fr)}.c3 .rw .ar{display:none}.c3 .rw .cl{font-size:clamp(28px,8.8vw,42px)}.c3 .mq{font-size:clamp(28px,8.8vw,42px)}.c3 .sub{left:var(--pad);grid-template-columns:1fr;gap:6px}.c3 .sub span{font-size:13px;padding-top:5px}}
@media (prefers-reduced-motion:reduce){.c3 .rw.act .mq{animation:none}.c3 .bi{transition:none}}
</style>

<div class="bar">
  <div class="grp" id="gcon"><span class="lb">About 1</span><button type="button" data-c="1"><b>1</b><span class="t">Pieces</span></button><button type="button" data-c="2"><b>2</b><span class="t">Both, differently</span></button><button type="button" data-c="3"><b>3</b><span class="t">Three questions</span></button></div>
  <span class="sp"></span><span class="tag">Lab 3 · not linked from the site</span>
</div>
<section class="ctx"><span>End of the pressed hero, for context · scroll ↓</span></section>
<canvas class="dith" id="dith" aria-hidden="true"></canvas>
<section class="scene" id="scene"><div class="stage" id="stage"><canvas id="cv" aria-hidden="true"></canvas><div class="ui" id="ui"></div></div></section>
<section class="next"><span>Next: the violet roles screen (“Here is what I have been doing…”), for context</span></section>
<section class="notes" id="notes" aria-live="polite"></section>

<script>
(function () {
var D = document, W = window, RM = matchMedia('(prefers-reduced-motion: reduce)').matches, FINE = matchMedia('(pointer: fine)').matches;
var cl = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; }, sm = function (t) { return t * t * (3 - 2 * t); }, eo = function (t) { return 1 - Math.pow(1 - t, 3); };
var hash = function (x, y) { var h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); };
var esc = function (s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
var MAIN = 'I’m interested in how things work, why people interact with them, and what happens when you look at both differently.';
var SUB = 'I explore through research, experiment through design, and keep questioning until the pieces make sense together.';
var SUBC = ['I explore through research,', 'experiment through design,', 'and keep questioning until the pieces make sense together.'];

/* ---------- shared: the dot scramble (the reference resolves text out of its ASCII glyphs; here out of dots) ---------- */
var DOTS = '··::∙•▪▪■■';
function scramble(el, txt, ms, delay) {
  if (RM) { el.textContent = txt; return; }
  cancelAnimationFrame(el._sr); clearTimeout(el._st);
  el._st = setTimeout(function () {
    var t0 = performance.now(), n = txt.length;
    (function f() {
      var p = Math.min(1, (performance.now() - t0) / (ms || 700)), e = p * p, k = e * (n + 6), o = '';   // power2.in, like the reference

    })();
  }, delay || 0);
}
/* ---------- shared: split a paragraph into masked lines (measured after the fonts are in) ---------- */
function splitLines(el, html, chars) {
  // each word gets its own mask; words on the same line share a delay, so it reads as lines rising (and keeps all spacing)
  el.innerHTML = html; var wis = [];

}

var setOn = function (el, v) { if (el) el.classList.toggle('on', !!v); };

/* ---------- context: the hero's grey closing into the dark as dots, drawn once ---------- */
(function () {
  var c = D.getElementById('dith'), dpr = Math.min(2, devicePixelRatio || 1), w = c.clientWidth, h = c.clientHeight; c.width = w * dpr; c.height = h * dpr;

/* ---------- stage ---------- */
var cv = D.getElementById('cv'), x = cv.getContext('2d'), ui = D.getElementById('ui'), stage = D.getElementById('stage'), scene = D.getElementById('scene');
var off = D.createElement('canvas'), oc = off.getContext('2d', { willReadFrequently: true });
var Wd = 0, Ht = 0, small = false, dpr = 1, R = null, con = 1, cur = null;

var C = {};

/* =========================== 1 · Pieces =========================== */
C[1] = { name: 'Pieces', h: 380,
  lead: 'Editorial, closest to the reference’s introduction. The statement is set large in four grid columns and rises line by line; its letters are loose enough to fall when you touch them. In the empty columns, scattered fragments of dots drift together as you scroll and lock into one solid block, and the subtext arrives beside it: “until the pieces make sense together”.',
  pts: [['Layout & type', 'The reference’s restraint: one large size for the statement (Archivo 380, columns 2–5), the subtext small in the far columns at the foot, a mono label in the margin. Most of the screen stays empty on purpose.'],
        ['Motion', 'Statement: masked lines, 95 ms apart, eased like the reference (scroll-triggered, time-based). Fragments: scroll-scrubbed and eased, each with its own delay, so they arrive one after another and the last one clicks in. The verbs of the subtext scramble in out of dot glyphs.'],
        ['Dots', 'The Index’s dim grid in the background; the fragments are the Index’s bright square dots. When they lock, the dots grow until the block is solid, the same move the hero makes when it closes into the dark.'],
        ['Small reward', 'Hover a letter of the statement and it falls to the floor of the screen and comes back a moment later (the reference’s falling letters). On a phone, tap a word.'],
        ['In / out', 'Enters from the hero closing into the dark as dots (above), leaves into the violet roles screen, which can open from the solid block.'],
        ['Mobile', 'Statement full width at the top, block assembles under it, subtext at the foot. Falling letters on tap.'],
        ['Extends to the site', 'The masked line reveal becomes the site’s one text entrance (statement, card intros, About page). The fragments-to-block move works as the transition into each discipline card, and the falling letters can live on every large heading.', true]],
  build: function () {
    var P = small ? 10 : 13;
    ui.innerHTML = '<div class="c1"><span class="hd lab">[ About ]</span><p class="main"></p>' +
      '<p class="sub rise"><span class="lab">How I work</span>I <span class="tg sv">explore</span> through research, <span class="tg sv">experiment</span> through design, and <span class="tg sv">keep questioning</span> until the pieces make sense together.</p>' +
      '<span class="hint lab rise">' + (FINE ? 'touch a letter' : '') + '</span></div>';
    var main = ui.querySelector('.main'); splitLines(main, esc(MAIN), true);
    var sub = ui.querySelector('.sub'), sr = stage.getBoundingClientRect(), r = sub.getBoundingClientRect();
    // the block the pieces assemble into: above the subtext, its width
    var bw = Math.floor(r.width / P), bh = small ? 6 : 9, bx = Math.round((r.left - sr.left) / P) * P, by = Math.round((r.top - sr.top - 30 - bh * P) / P) * P;

      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (d) { var nx = cx + d[0], ny = cy + d[1]; if (nx < 0 || ny < 0 || nx >= bw || ny >= bh) return; var j = ny * bw + nx; if (owner[j] < 0) { owner[j] = owner[i]; q0.push(j); } }); }
