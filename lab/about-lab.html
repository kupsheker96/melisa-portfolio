<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>About Lab · Melisa Ergani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* About lab (Nov 26): isolated explorations for the two About sections. Not linked from the site. Uses the site's
   palette, type, grid and dots; every concept is scroll-driven with an eased progress, so movement stays fluid on a
   wheel, a trackpad or a swipe, and nothing runs while the page rests. */
@font-face{font-family:'Mondwest';src:url(../fonts/ppmondwest-regular.woff2) format('woff2');font-display:swap}
:root{color-scheme:dark;--bg:#121316;--ink:#f4f3ef;--dim:#45484f;--mut:#9a9ea6;--line:#2c2e33;--vio:#8e6bff;--grey:#dfdfdb;--blue:#2b35ff;--pink:#ff4fb0;--pad:clamp(16px,4vw,56px);--rule:calc(var(--pad) + (100vw - 2 * var(--pad)) * .16);--ease:cubic-bezier(.2,.7,.2,1);--ease2:cubic-bezier(.65,0,.25,1)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:300 13px/1.55 'JetBrains Mono',ui-monospace,monospace;overflow-x:clip;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
/* bar */
.bar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px var(--pad);padding-top:calc(8px + env(safe-area-inset-top,0px));pointer-events:none}
.bar > *{pointer-events:auto}
.grp{display:flex}
.grp > *{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid rgba(244,243,239,.5);background:rgba(18,19,22,.9);color:var(--ink);text-decoration:none;font:400 11px/1 'JetBrains Mono',monospace;cursor:pointer;white-space:nowrap}
.grp > * + *{margin-left:-1px}
.grp [aria-current=true],.grp [aria-pressed=true]{background:var(--ink);color:var(--bg)}
.grp b{font:400 14px/1 'Mondwest',serif}
.grp .lb{color:var(--mut);cursor:default;background:rgba(18,19,22,.9)}
.sp{flex:1}
.tag{color:var(--mut);font-size:10px;background:rgba(18,19,22,.9);padding:4px 8px;border:1px solid var(--line)}
@media (max-width:760px){.grp > *{padding:0 9px;height:32px}.grp .t{display:none}.tag{display:none}}
/* context + scene */
.ctx{height:70svh;display:flex;align-items:flex-end;padding:var(--pad);font-size:11px;color:var(--mut)}
.ctx.grey{background:var(--grey);color:rgba(18,19,22,.55)}
.ctx.black{background:#000}
.ctx h2{margin:0 0 6px;font:800 clamp(56px,9vw,150px)/.82 'Archivo',sans-serif;font-stretch:62%;text-transform:uppercase;letter-spacing:-.015em;color:var(--ink)}
.scene{position:relative}
.stage{position:sticky;top:0;height:100svh;overflow:hidden}
.stage > canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ui{position:absolute;inset:0}
#ht{position:fixed;inset:0;width:100%;height:100%;z-index:30;pointer-events:none;visibility:hidden}
.after{height:40svh}
/* notes */
.notes{background:var(--bg);border-top:1px solid var(--line);padding:clamp(56px,7vw,110px) var(--pad);display:grid;grid-template-columns:16% repeat(6,minmax(0,1fr))}
.notes > *{padding-left:clamp(14px,1.6vw,24px)}
.notes .k{grid-column:1;padding-left:0;color:var(--mut);font-size:11px}
.notes h3{grid-column:2 / -1;margin:0 0 10px;font:800 clamp(38px,5vw,86px)/.86 'Archivo',sans-serif;font-stretch:62%;text-transform:uppercase;letter-spacing:-.015em}
.notes .lead{grid-column:2 / span 4;margin:0 0 34px;font:380 clamp(18px,1.6vw,24px)/1.32 'Archivo',sans-serif;color:#e6e5e0;max-width:34em}
.notes dl{grid-column:2 / -1;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 clamp(16px,2vw,32px)}
.notes dl div{padding:12px 0 16px;border-top:1px solid var(--line)}
.notes dt{color:var(--mut);font-size:11px;margin-bottom:6px}
.notes dd{margin:0;font:380 15px/1.55 'Archivo',sans-serif;color:#c9ccd1}
.notes .nav{grid-column:2 / -1;margin-top:28px;display:flex;gap:10px;flex-wrap:wrap}
.notes .nav a{color:var(--ink);font-size:12px;border-bottom:1px solid var(--mut);text-decoration:none;padding-bottom:2px}
@media (max-width:760px){.notes{grid-template-columns:1fr}.notes > *,.notes h3,.notes .lead,.notes dl,.notes .nav{grid-column:1;padding-left:0}.notes dl{grid-template-columns:1fr}}
/* shared type */
.lab{font:300 11px/1.4 'JetBrains Mono',monospace;color:var(--mut)}
.mw{font-family:'Mondwest',serif;font-weight:400;letter-spacing:0}
.big{font:380 clamp(26px,3.3vw,58px)/1.1 'Archivo',sans-serif;letter-spacing:-.025em;margin:0;text-wrap:balance}
.mid{font:380 clamp(17px,1.45vw,24px)/1.3 'Archivo',sans-serif;letter-spacing:-.01em;margin:0}
/* word rise (time-based, staggered) */
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .02em .12em;margin:0 -.02em -.12em}
.wi{display:inline-block;transform:translate3d(0,108%,0);transition:transform .8s var(--ease);transition-delay:calc(var(--i,0) * 28ms)}
.on .wi,.wi.on{transform:none}
.rise{opacity:0;transform:translate3d(0,16px,0);transition:opacity .6s var(--ease),transform .8s var(--ease)}
.rise.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.wi,.rise{transition:none!important;transform:none!important;opacity:1!important}}

/* ===== F1 Between ===== */
.f1 .intro{position:absolute;left:var(--pad);right:var(--pad);top:calc(70px + 7vh);text-align:center}
.f1 .intro .big{max-width:24ch;margin:0 auto}
.f1 .rail{position:absolute}
.f1 .ln{position:absolute;background:var(--ink)}
.f1 .pole{position:absolute;width:11px;height:11px;margin:-5px 0 0 -5px;background:var(--ink)}
.f1 .pl{position:absolute;font:300 11px/1.4 'JetBrains Mono',monospace;color:var(--mut);white-space:nowrap}
.f1 .core{position:absolute;width:15px;height:15px;margin:-7px 0 0 -7px;background:var(--bg);border:1px solid var(--ink);transition:background .4s,border-color .4s,transform .7s var(--ease)}
.f1 .core.on{background:var(--vio);border-color:var(--vio)}
.f1 .core.big2{transform:scale(2.4)}
.f1 .ring{position:absolute;width:15px;height:15px;margin:-7px 0 0 -7px;border:1px solid var(--vio);opacity:0}
.f1 .ring.go{animation:ring 1.1s var(--ease) 1}
@keyframes ring{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(7)}}
.f1 .stn{position:absolute;width:min(22vw,300px)}
.f1 .stn .kw{display:block;font-size:clamp(24px,2.3vw,40px);line-height:1;margin-bottom:8px}
.f1 .stn .cl{font:380 clamp(15px,1.15vw,19px)/1.3 'Archivo',sans-serif;color:#c9ccd1}
.f1 .stn.vio .kw{color:var(--vio)}

/* ===== F2 Index ===== */
.f2 .pre{position:absolute;left:var(--rule);top:calc(70px + 5vh);width:min(52vw,760px)}
.f2 .pre .lab{display:block;margin-bottom:12px}
.f2 .rows{position:absolute;left:var(--pad);right:var(--pad);bottom:var(--pad)}
.f2 .row{position:relative;display:grid;grid-template-columns:16% minmax(0,1fr) minmax(0,26%);align-items:end;gap:0 clamp(14px,1.6vw,24px);padding:10px 0 8px;cursor:default;transition:color .6s}
.f2 .row::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--line);transform:scaleX(0);transform-origin:0 50%;transition:transform .9s var(--ease2)}
.f2 .row.on::before{transform:scaleX(1)}
.f2 .row .n{font-size:clamp(20px,2vw,32px);line-height:.9;color:var(--mut);padding-left:2px}
.f2 .row .kw{font:800 clamp(38px,min(6.6vw,10.5vh),118px)/.84 'Archivo',sans-serif;font-stretch:62%;text-transform:uppercase;letter-spacing:-.015em;white-space:nowrap;visibility:hidden;transition:color .6s}
.f2 .row.on .kw{visibility:visible}
.f2 .row .cl{font:380 clamp(15px,1.15vw,19px)/1.3 'Archivo',sans-serif;color:#c9ccd1;padding-bottom:6px}
.f2 .row.past .kw{color:#5b5f67}
.f2 .row.past .cl{color:#6b6f77}
.f2 .row .sq{position:absolute;left:calc(16% - 4px);bottom:calc(8px + .3em);width:9px;height:9px;background:var(--vio);transform:scale(0);transition:transform .4s var(--ease)}
.f2 .row.cur .sq{transform:scale(1)}
@media (max-width:760px){.f2 .pre{left:var(--pad);right:var(--pad);width:auto}.f2 .row{grid-template-columns:34px minmax(0,1fr);padding:8px 0}.f2 .row .cl{grid-column:2;padding:4px 0 2px;font-size:14px}.f2 .row .sq{display:none}.f2 .row .kw{font-size:clamp(34px,11vw,54px)}}

/* ===== F3 Fields ===== */
.f3 .intro{position:absolute;left:var(--pad);right:var(--pad);top:calc(70px + 5vh);text-align:center}
.f3 .intro .big{max-width:26ch;margin:0 auto;font-size:clamp(22px,2.6vw,44px)}
.f3 .lbl{position:absolute;width:min(22vw,280px)}
.f3 .lbl .kw{display:flex;align-items:center;gap:10px;font-size:clamp(22px,2vw,34px);line-height:1;margin-bottom:8px}
.f3 .lbl .kw i{width:10px;height:10px;background:var(--ink);flex:none}
.f3 .lbl.vio .kw i{background:var(--vio)}
.f3 .lbl .cl{font:380 clamp(14px,1.1vw,18px)/1.3 'Archivo',sans-serif;color:#c9ccd1}
@media (max-width:760px){.f3 .lbl{width:auto;left:var(--pad)!important;right:var(--pad);transform:none!important}.f3 .lbl .kw{font-size:20px;margin-bottom:2px}.f3 .lbl .cl{font-size:14px}}

/* ===== F4 Exploded view ===== */
.f4 .wd{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;font:380 clamp(26px,3.1vw,54px)/1.1 'Archivo',sans-serif;letter-spacing:-.025em}
.f4 .ghost{position:absolute;left:var(--pad);right:var(--pad);top:calc(70px + 8vh);visibility:hidden;text-align:center}
.f4 .ghost p{margin:0 auto;max-width:24ch;font:380 clamp(26px,3.1vw,54px)/1.1 'Archivo',sans-serif;letter-spacing:-.025em}
.f4 svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.f4 svg line{stroke:#3a3d44;stroke-width:1;stroke-dasharray:3 4}
.f4 svg path{fill:none;stroke:var(--ink);stroke-width:1}
.f4 .ul{position:absolute;height:3px;background:var(--vio);transform:scaleX(0);transform-origin:0 50%;transition:transform .7s var(--ease2)}
.f4 .ul.on{transform:scaleX(1)}
.f4 .ul b{position:absolute;right:-2px;top:-22px;font-size:15px;color:var(--vio)}
.f4 .callouts{position:absolute;left:var(--rule);right:var(--pad);bottom:var(--pad);display:grid;gap:clamp(14px,1.6vw,24px)}
.f4 .co .n{font-size:22px;line-height:1;color:var(--vio);margin-bottom:6px;display:block}
.f4 .co .kw{display:block;font:600 clamp(15px,1.2vw,19px)/1.2 'Archivo',sans-serif;margin-bottom:4px}
.f4 .co .cl{font:380 clamp(14px,1.05vw,17px)/1.32 'Archivo',sans-serif;color:#c9ccd1}
@media (max-width:760px){.f4 .callouts{left:var(--pad);grid-template-columns:1fr 1fr!important;gap:14px}.f4 .co .n{font-size:17px}}

/* ===== F5 Reading light ===== */
.f5 .txt{position:absolute;left:var(--pad);top:calc(70px + 7vh);width:min(62vw,980px)}
.f5 .txt p{margin:0 0 .7em;font:380 clamp(22px,3vw,52px)/1.16 'Archivo',sans-serif;letter-spacing:-.02em}
.f5 .txt .wd{color:var(--dim);transition:color .35s}
.f5 .txt .wd.lit{color:var(--ink)}
.f5 .txt .wd.mw{font-size:1.06em}
.f5 .txt .wd.mw.lit{color:var(--ink)}
.f5 .car{display:inline-block;width:.32em;height:.32em;background:var(--vio);margin-left:.08em;vertical-align:.1em;transition:opacity .3s}
.f5 .pics{position:absolute;right:var(--pad);top:calc(70px + 7vh);width:min(26vw,380px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,1.6vw,24px)}
.f5 .pic{position:relative;aspect-ratio:1;border-top:1px solid var(--line);padding-top:8px;transition:opacity .6s}
.f5 .pic.dimd{opacity:.32}
.f5 .pic svg{width:100%;height:calc(100% - 22px);overflow:visible}
.f5 .pic svg path,.f5 .pic svg rect,.f5 .pic svg circle{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.f5 .pic .lab{position:absolute;left:0;bottom:0}
@media (max-width:760px){.f5 .txt{left:var(--pad);right:var(--pad);width:auto;top:calc(70px + 17vh)}.f5 .txt p{font-size:clamp(19px,5.4vw,24px)}.f5 .pics{left:var(--pad);right:var(--pad);width:auto;top:calc(56px + 2vh);grid-template-columns:repeat(4,1fr);gap:10px}.f5 .pic{padding-top:4px}.f5 .pic .lab{display:none}.f5 .pic svg{height:100%}}

/* ===== S1 Zoom out ===== */
.s1 .t1,.s1 .t2{position:absolute;left:var(--pad);right:var(--pad);text-align:center;will-change:transform}
.s1 .t1{top:30%}
.s1 .t1 p{margin:0 auto;max-width:20ch;font:380 clamp(30px,4.4vw,80px)/1.06 'Archivo',sans-serif;letter-spacing:-.03em;transform:translateY(-50%)}
.s1 .t1 .v{transition:color .5s}
.s1 .t1 .v.dimv{color:var(--dim)}
.s1 .t2{bottom:calc(var(--pad) + 4vh)}
.s1 .t2 p{margin:0 auto;max-width:30ch;font:380 clamp(20px,2.2vw,38px)/1.18 'Archivo',sans-serif;letter-spacing:-.02em}
.s1 .hd{position:absolute;left:var(--pad);top:calc(70px + 3vh)}

/* ===== S2 Full stop ===== */
.s2 .txt{position:absolute;left:var(--rule);right:var(--pad);top:50%;transform:translateY(-58%)}
.s2 .txt p{margin:0;max-width:21ch;font:380 clamp(30px,4.3vw,78px)/1.06 'Archivo',sans-serif;letter-spacing:-.03em}
.s2 .txt p + p{margin-top:.5em;color:#c9ccd1}
.s2 .stop{display:inline-block;width:.2em;height:.2em;background:var(--vio);margin-left:.04em;transform:scale(0);transition:transform .5s var(--ease)}
.s2 .stop.on{transform:none}
.s2 .trail{position:absolute;height:0;right:0;overflow:hidden}
.s2 .trail i{position:absolute;left:0;top:0;height:100%;width:100%;background-image:linear-gradient(90deg,var(--vio) 0 var(--sz),transparent var(--sz) 100%);background-size:var(--gap) 100%;transform-origin:0 50%}
.s2 .trail.go i{animation:drift 2.4s linear infinite}
@keyframes drift{to{background-position:var(--gap) 0}}
.s2 .hd{position:absolute;left:var(--pad);top:calc(70px + 3vh)}
@media (max-width:760px){.s2 .txt{left:var(--pad)}.s2 .txt p{font-size:clamp(28px,8.4vw,40px)}}
@media (prefers-reduced-motion:reduce){.s2 .trail.go i{animation:none}}

/* ===== S3 Pressed ===== */
.s3 .top{position:absolute;left:var(--pad);right:var(--pad);top:calc(70px + 5vh);text-align:center;color:#121316}
.s3 .top p{margin:0 auto;max-width:30ch;font:380 clamp(19px,1.9vw,32px)/1.2 'Archivo',sans-serif;letter-spacing:-.02em}
.s3 .top .v{transition:color .4s,background .4s;padding:0 .08em}
.s3 .top .v.cur{background:#121316;color:var(--grey)}
.s3 .top .p2{margin-top:.6em}
.s3 .ticks{position:absolute;left:50%;bottom:var(--pad);transform:translateX(-50%);display:flex;gap:5px}
.s3 .ticks i{width:26px;height:3px;background:rgba(18,19,22,.22)}
.s3 .ticks i.on{background:#121316}
</style>

/* 3 · Pressed: the hero's pressed dots, carrying the three verbs and then "yet" */
S[3] = { name: 'Pressed verbs', h: 460,
  lead: 'The hero’s surface returns: making, learning, figuring are pressed into the grey dots one after another as the sentence is read; then the last press is “YET”, and the second sentence appears under the first.',

  build: function () {

      var a = M.slice(), b = new Float32Array(M.length);

        for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) { var s = 0, qq = 0; for (var dd = -1; dd <= 1; dd++) if (c + dd >= 0 && c + dd < cols) { s += a[r * cols + c + dd]; qq++; } b[r * cols + c] = s / qq; }
        for (r = 0; r < rows; r++) for (c = 0; c < cols; c++) { s = 0; qq = 0; for (dd = -1; dd <= 1; dd++) if (r + dd >= 0 && r + dd < rows) { s += b[(r + dd) * cols + c]; qq++; } a[r * cols + c] = s / qq; }

/* =============================== engine =============================== */
var tq = 0, q = 0, raf = 0, keep = false;

function frame(t) {
  raf = 0; if (!R) return;
  var vh = innerHeight, top = scene.getBoundingClientRect().top;
  if (sec === 's') hDraw(RM ? 0 : cl((vh * 1.3 - top) / (vh * 0.7)), RM ? 1 : cl((vh * 0.35 - top) / (vh * 0.6))); else hDraw(0, 1);

function go() {

  var nav = keys.map(function (k) { return '<a href="#' + hashFor(sec, txt, +k) + '">' + k + ' ' + set[k].name + '</a>'; }).join('');
  n.innerHTML = '<div class="k">[ ' + title + ' ]</div><h3>' + con + ' · ' + cur.name + '</h3><p class="lead">' + cur.lead + '</p><dl>' + cur.pts.map(function (p, i) { return '<div><dt>0' + (i + 1) + ' ' + p[0] + '</dt><dd>' + p[1] + '</dd></div>'; }).join('') + '</dl><div class="nav">' + nav + '</div>';
  scrollTo(0, 0); q = 0;

}
